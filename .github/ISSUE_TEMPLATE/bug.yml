      label: Pantalla
      options:
        - App de Anima (frontent-2/index.html)
        - Tablero institucional (frontent-2/dashboard.html)
        - WhatsApp (frontend-3-whatsapp)
        - Consentimiento municipal (frontent-2-extention)
        - Recorrido con flechas (grupo-9 y siguientes)
        - Documentación
        - Otra
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Navegador y tamaño de ventana
      placeholder: Chrome, laptop de 1440 px
    validations:
      required: true
