labels: []
body:
  - type: textarea
    id: que-hiciste
    attributes:
      label: Qué hiciste
      description: Los pasos, en orden, para volver a verlo.
    validations:
      required: true
  - type: textarea
    id: que-esperabas
    attributes:
      label: Qué esperabas
    validations:
      required: true
  - type: textarea
    id: que-viste
    attributes:
      label: Qué viste
    validations:
      required: true
  - type: dropdown
    id: pantalla
