<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salud mental en Salta — Presentación</title>
<style>
  :root {
    color-scheme: light;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    --white: oklch(1 0 0);
    --acento: oklch(0.58 0.22 28);
    --fondo: oklch(0.975 0.004 80);
    --tinta: oklch(0.14 0.004 270);
    --divider: oklch(0.90 0.005 270);
    --sombra: 0 1px 2px oklch(0.4 0.01 270 / 0.05), 0 8px 24px oklch(0.4 0.01 270 / 0.05);
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; height: 100%; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 4vh 4vw;
    background: var(--fondo);
    color: var(--tinta);
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    display: flex;
    width: 100%;
    max-width: 1180px;
    flex-direction: column;
    align-items: center;
    gap: 4vh;
    text-align: center;
  }

  .hero {
    display: flex;
    flex-direction: column;
    gap: 14px;
    will-change: opacity, transform;
    animation: subir 620ms cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .hero p {
    margin: 0 auto;
    max-width: 22ch;
    color: var(--tinta);
    font-size: clamp(2.5rem, 6vw, 4.5rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.1;
  }

  .hero p b {
    color: var(--acento);
    font-weight: 800;
  }

  .comparacion {
    display: flex;
    width: 100%;
    align-items: stretch;
    justify-content: center;
    border-radius: 24px;
    background: var(--white);
    box-shadow: var(--sombra);
    overflow: hidden;
    will-change: opacity, transform;
    animation: subir 620ms cubic-bezier(0.16, 1, 0.3, 1) 160ms both;
  }

  .cifra {
    display: flex;
    flex: 1;
    flex-direction: column;
    justify-content: center;
    gap: 8px;
    padding: 5vh 3vw;
  }

  .cifra .num {
    color: var(--tinta);
    font-size: clamp(3rem, 6.5vw, 5rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
  }

  .cifra.nacional .num,
  .cifra.nacional .label { color: var(--tinta); }

  .cifra .label {
    color: var(--tinta);
    font-size: clamp(0.9375rem, 1.4vw, 1.0625rem);
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .separador {
    display: flex;
    flex: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 3vh 2.2vw;
    border-left: 1px solid var(--divider);
    border-right: 1px solid var(--divider);
  }

  .separador .delta {
    color: var(--acento);
    font-size: clamp(3rem, 6.5vw, 5rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
    white-space: nowrap;
  }

  .separador span {
    max-width: 13ch;
    color: var(--tinta);
    font-size: clamp(0.8125rem, 1.1vw, 0.9375rem);
    font-weight: 700;
    letter-spacing: -0.01em;
    text-align: center;
  }

  .pill {
    color: var(--tinta);
    font-size: clamp(1.5rem, 2.8vw, 2rem);
    font-weight: 700;
    letter-spacing: -0.01em;
    will-change: opacity, transform;
    animation: subir 620ms cubic-bezier(0.16, 1, 0.3, 1) 240ms both;
  }

  @keyframes subir {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .hero, .comparacion, .pill { animation: none; }
  }

  @media (max-width: 720px) {
    .comparacion { flex-direction: column; }
    .separador {
      width: 100%;
      padding: 20px 0;
      border-left: none;
      border-right: none;
      border-top: 1px solid var(--divider);
      border-bottom: 1px solid var(--divider);
    }
  }

  body.is-leaving > .stage {
    will-change: filter, opacity, transform;
    animation: salir 420ms cubic-bezier(0.25, 1, 0.5, 1) both;
  }

  @keyframes salir {
    from { filter: blur(0); opacity: 1; transform: scale(1); }
    to { filter: blur(3px); opacity: 0; transform: scale(0.985); }
  }

  @media (prefers-reduced-motion: reduce) {
    body.is-leaving > .stage { animation: dashboard-fade-out 100ms linear both; }
  }

  @keyframes dashboard-fade-out {
    from { opacity: 1; }
    to { opacity: 0; }
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="hero">
      <p>Cada <b>36 horas</b>, Salta pierde una vida a causa del suicidio.</p>
    </div>

    <div class="comparacion">
      <div class="cifra salta">
        <span class="num">17,4</span>
        <span class="label">Salta cada 100.000 hab.</span>
      </div>
      <div class="separador">
        <span class="delta">↑ 47%</span>
        <span>sobre la media nacional</span>
      </div>
      <div class="cifra nacional">
        <span class="num">11,8</span>
        <span class="label">Promedio argentino</span>
      </div>
    </div>

    <p class="pill">3.ª provincia con mayor tasa del país</p>
  </main>

  <script>
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
    let isLeaving = false;

    document.addEventListener("keydown", event => {
      const isSpace = event.code === "Space" || event.key === " ";
      if (!isSpace || event.repeat || isLeaving) return;

      event.preventDefault();
      isLeaving = true;
      document.body.classList.add("is-leaving");

      window.setTimeout(() => {
        window.location.href = "mood-splash.html";
      }, reduceMotion.matches ? 100 : 420);
    });
  </script>
  <script src="presentation-flow.js" defer></script>
</body>
</html>
