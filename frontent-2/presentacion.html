<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salud mental en Salta — Presentación</title>
<style>
  :root {
    color-scheme: light;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    --white: oklch(1 0 0);
    --blue: oklch(0.56 0.18 255);
    --naranja: oklch(0.72 0.18 50);
    --alarma: oklch(0.58 0.22 28);
    --fondo: oklch(0.965 0.006 270);
    --tinta: oklch(0.14 0.004 270);
    --tenue: oklch(0.42 0.02 260);
    --divider: oklch(0.90 0.005 270);
    --sombra: 0 1px 2px oklch(0.4 0.01 270 / 0.06), 0 8px 24px oklch(0.4 0.01 270 / 0.07);
    --sombra-fuerte: 0 2px 4px oklch(0.4 0.01 270 / 0.08), 0 20px 48px oklch(0.4 0.01 270 / 0.14);
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; height: 100%; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 4vh 4vw;
    background:
      radial-gradient(circle at 12% 8%, oklch(0.95 0.05 50 / 0.9), transparent 42%),
      radial-gradient(circle at 88% 92%, oklch(0.93 0.05 255 / 0.8), transparent 45%),
      var(--fondo);
    color: var(--tinta);
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    display: flex;
    width: 100%;
    max-width: 1180px;
    flex-direction: column;
    align-items: center;
    gap: 4vh;
    text-align: center;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin: 0;
    padding: 10px 22px;
    border-radius: 999px;
    background: var(--white);
    box-shadow: var(--sombra);
    color: var(--blue);
    font-size: clamp(0.9375rem, 1.4vw, 1.125rem);
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    will-change: opacity, transform;
    animation: subir 620ms cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .eyebrow::before {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--alarma);
    content: "";
  }

  .hero {
    display: flex;
    flex-direction: column;
    gap: 14px;
    will-change: opacity, transform;
    animation: subir 620ms cubic-bezier(0.16, 1, 0.3, 1) 80ms both;
  }

  .hero-num {
    margin: 0;
    background: linear-gradient(135deg, var(--alarma), var(--naranja));
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    font-size: clamp(7rem, 22vw, 13.5rem);
    font-weight: 850;
    letter-spacing: -0.04em;
    line-height: 0.95;
  }

  .hero-num span {
    font-size: 0.32em;
    font-weight: 780;
    letter-spacing: -0.01em;
    vertical-align: middle;
  }

  .hero p {
    margin: 0 auto;
    max-width: 34ch;
    color: var(--tinta);
    font-size: clamp(1.5rem, 3vw, 2.125rem);
    font-weight: 680;
    letter-spacing: -0.02em;
    line-height: 1.25;
  }

  .comparacion {
    display: flex;
    width: 100%;
    align-items: stretch;
    justify-content: center;
    border-radius: 32px;
    background: var(--white);
    box-shadow: var(--sombra-fuerte);
    overflow: hidden;
    will-change: opacity, transform;
    animation: subir 620ms cubic-bezier(0.16, 1, 0.3, 1) 160ms both;
  }

  .cifra {
    display: flex;
    flex: 1;
    flex-direction: column;
    justify-content: center;
    gap: 8px;
    padding: 5vh 3vw;
  }

  .cifra.salta { background: oklch(0.95 0.06 28); }
  .cifra.nacional { background: oklch(0.94 0.045 255); }

  .cifra .num {
    font-size: clamp(3.25rem, 8vw, 6rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
  }

  .cifra.salta .num { color: var(--alarma); }
  .cifra.nacional .num { color: var(--blue); }

  .cifra .label {
    color: var(--tinta);
    font-size: clamp(1rem, 1.6vw, 1.1875rem);
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .separador {
    display: flex;
    flex: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 3vh 2.2vw;
    background: var(--white);
  }

  .delta {
    display: inline-flex;
    align-items: center;
    padding: 10px 20px;
    border-radius: 999px;
    background: var(--alarma);
    box-shadow: var(--sombra);
    color: var(--white);
    font-size: clamp(1.375rem, 2.4vw, 1.875rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    white-space: nowrap;
  }

  .separador span {
    max-width: 13ch;
    color: var(--tenue);
    font-size: clamp(0.8125rem, 1.1vw, 0.9375rem);
    font-weight: 700;
    letter-spacing: -0.01em;
    text-align: center;
  }

  .pill {
    padding: 16px 32px;
    border-radius: 999px;
    background: var(--naranja);
    box-shadow: var(--sombra-fuerte);
    color: var(--white);
    font-size: clamp(1.25rem, 2.6vw, 1.75rem);
    font-weight: 750;
    letter-spacing: -0.02em;
    will-change: opacity, transform;
    animation: subir 620ms cubic-bezier(0.16, 1, 0.3, 1) 240ms both;
  }

  @keyframes subir {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .eyebrow, .hero, .comparacion, .pill { animation: none; }
  }

  @media (max-width: 720px) {
    .comparacion { flex-direction: column; }
    .separador {
      width: 100%;
      padding: 20px 0;
    }
  }

  body.is-leaving > .stage {
    will-change: filter, opacity, transform;
    animation: salir 420ms cubic-bezier(0.25, 1, 0.5, 1) both;
  }

  @keyframes salir {
    from { filter: blur(0); opacity: 1; transform: scale(1); }
    to { filter: blur(3px); opacity: 0; transform: scale(0.985); }
  }

  @media (prefers-reduced-motion: reduce) {
    body.is-leaving > .stage { animation: dashboard-fade-out 100ms linear both; }
  }

  @keyframes dashboard-fade-out {
    from { opacity: 1; }
    to { opacity: 0; }
  }
</style>
</head>
<body>
  <main class="stage">
    <p class="eyebrow">Observatorio de Salud Mental — Provincia de Salta</p>

    <div class="hero">
      <p class="hero-num">36<span>hs</span></p>
      <p>Cada 36 horas, Salta pierde una vida a causa del suicidio.</p>
    </div>

    <div class="comparacion">
      <div class="cifra salta">
        <span class="num">17,4</span>
        <span class="label">Salta cada 100.000 hab.</span>
      </div>
      <div class="separador">
        <span class="delta">↑ 47%</span>
        <span>sobre la media nacional</span>
      </div>
      <div class="cifra nacional">
        <span class="num">11,8</span>
        <span class="label">Promedio argentino</span>
      </div>
    </div>

    <p class="pill">3.ª provincia con mayor tasa del país</p>
  </main>

  <script>
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
    let isLeaving = false;

    document.addEventListener("keydown", event => {
      const isSpace = event.code === "Space" || event.key === " ";
      if (!isSpace || event.repeat || isLeaving) return;

      event.preventDefault();
      isLeaving = true;
      document.body.classList.add("is-leaving");

      window.setTimeout(() => {
        window.location.href = "../frontend-3-whatsapp/index.html";
      }, reduceMotion.matches ? 100 : 420);
    });
  </script>
</body>
</html>
