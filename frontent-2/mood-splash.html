<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anima</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    background: #fff;
  }

  h1 {
    margin: 0;
    color: #000;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    font-size: clamp(2.25rem, 9vw, 4.5rem);
    font-weight: 700;
    letter-spacing: -0.035em;
  }

  .flower-sequence {
    width: min(82vw, 320px);
    aspect-ratio: 1;
    contain: paint;
    pointer-events: none;
    user-select: none;
  }

  .flower-sequence img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 12px 22px rgb(75 149 201 / 22%));
    -webkit-user-drag: none;
  }
</style>
</head>
<body>
  <h1>Anima</h1>
  <div class="flower-sequence" aria-hidden="true">
    <img
      id="flower-frame"
      src="assets/anima-flower/flower-000.webp"
      width="640"
      height="640"
      alt=""
      draggable="false"
    >
  </div>

<script>
  const FRAME_COUNT = 101;
  const LAST_FRAME = FRAME_COUNT - 1;
  const LOOP_DURATION = 7000;
  const END_HOLD_STEPS = 6;
  const frameSource = index => `assets/anima-flower/flower-${String(index).padStart(3, "0")}.webp`;
  const frameSources = Array.from({ length: FRAME_COUNT }, (_, index) => frameSource(index));
  const forwardFrames = Array.from({ length: FRAME_COUNT }, (_, index) => index);
  const backwardFrames = Array.from({ length: LAST_FRAME - 1 }, (_, index) => LAST_FRAME - 1 - index);
  const sequence = [
    ...Array(END_HOLD_STEPS).fill(0),
    ...forwardFrames,
    ...Array(END_HOLD_STEPS).fill(LAST_FRAME),
    ...backwardFrames
  ];
  const FRAME_INTERVAL = LOOP_DURATION / sequence.length;

  const flowerFrame = document.querySelector("#flower-frame");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");

  window.addEventListener("keydown", event => {
    if (event.code === "Space") {
      event.preventDefault();
      window.location.href = "../frontend-3-whatsapp/index.html";
    }
  });

  const waitForFrame = image => new Promise(resolve => {
    if (image.complete) {
      resolve();
      return;
    }
    image.addEventListener("load", resolve, { once: true });
    image.addEventListener("error", resolve, { once: true });
  });

  const startSequence = async () => {
    if (reduceMotion.matches) {
      flowerFrame.src = frameSources[50];
      return;
    }

    const preloadedFrames = frameSources.map(source => {
      const image = new Image();
      image.decoding = "async";
      image.src = source;
      return image;
    });

    await Promise.all(preloadedFrames.map(waitForFrame));
    await Promise.all(preloadedFrames.map(image => image.decode?.().catch(() => undefined)));

    let step = 0;
    let nextFrameAt = performance.now() + FRAME_INTERVAL;

    const tick = time => {
      if (time >= nextFrameAt) {
        const elapsedSteps = Math.floor((time - nextFrameAt) / FRAME_INTERVAL) + 1;
        step = (step + elapsedSteps) % sequence.length;
        flowerFrame.src = frameSources[sequence[step]];
        nextFrameAt += elapsedSteps * FRAME_INTERVAL;
      }
      requestAnimationFrame(tick);
    };

    requestAnimationFrame(tick);
  };

  startSequence();
</script>
  <script src="presentation-flow.js" defer></script>
</body>
</html>
